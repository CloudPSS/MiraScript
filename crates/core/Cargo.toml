[package]
name = "mirascript-core"
description = "Compiler and bytecode definitions for the MiraScript language"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mirascript-core"
readme = "README.md"
keywords = ["mirascript", "compiler", "parser", "scripting", "language"]
categories = ["compilers", "parser-implementations"]
publish = ["crates-io"]

[lib]
name = "mirascript_core"

[[bench]]
name = "main"
harness = false

[features]
default = []
formatter = ["dep:pretty"]
wasm = ["dep:wasm-bindgen"]
wasm-constants = ["dep:wasm-bindgen"]
serde = ["dep:serde"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
divan = "0.1.21"
mirascript-core = { path = ".", features = ["mimalloc", "formatter"] }

[dependencies]
unicode-ident = "1"
winnow = "1"
strum = { version = "0.28", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
pretty = { version = "0.12", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true, features = ["v2"] }
